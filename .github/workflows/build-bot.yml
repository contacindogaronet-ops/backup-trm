name: Build Telegram Userbot

on:
  push:
    paths:
      - 'bot/**'
      - '.github/workflows/build-bot.yml'
  workflow_dispatch:

jobs:
  build:
    name: Compile Userbot Engine
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          check-latest: true

      - name: Tidy Dependencies
        working-directory: ./bot
        run: go mod tidy

      - name: Build Static Binary ARM64
        working-directory: ./bot
        env:
          GOOS: linux
          GOARCH: arm64
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          go build -trimpath -ldflags="-s -w" -o dist/tg-userbot-arm64 .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: tg-userbot-arm64
          path: bot/dist/tg-userbot-arm64
